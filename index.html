<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script>
        // Previne o flash de tema branco ao carregar
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconsVault | AkiraDev</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="IconsVault - Baixe, personalize e copie ícones SVG de diversas bibliotecas.">
    <meta property="og:title" content="IconsVault by AkiraDev">
    <meta property="og:description" content="O seu cofre de ícones SVG. Personalize cor, tamanho e espessura.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'></path><polyline points='3.27 6.96 12 12.01 20.73 6.96'></polyline><line x1='12' y1='22.08' x2='12' y2='12'></line></svg>">
    <!-- Script oficial do Lucide (Vanilla JS) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
    <div class="logo">
        <i data-lucide="box" class="logo-icon"></i>
        <h1>IconsVault</h1>
    </div>
    
    <div class="header-actions">
        <a href="https://github.com/akiradv/iconsvault" target="_blank" rel="noopener" class="github-btn" title="Ver no GitHub">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
        <path d="M9 18c-4.51 2-5-2-7-2"/>
    </svg>
</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema">
            <i data-lucide="moon" class="theme-icon"></i>
        </button>
    </div>
</header>

                  <div class="controls">
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="Buscar ícones (ex: home, user, arrow, file)...">
            </div>
            
            <!-- ABAS DE FILTRO POR BIBLIOTECA -->
            <div class="library-tabs">
    <button class="tab-btn active" data-filter="all">
        Todos
        <span class="tab-count" id="count-all">0</span>
    </button>
    <button class="tab-btn" data-filter="lucide">
        Lucide
        <span class="tab-count" id="count-lucide">0</span>
    </button>
    <button class="tab-btn" data-filter="tabler">
        Tabler
        <span class="tab-count" id="count-tabler">0</span>
    </button>
    <button class="tab-btn" data-filter="ph">
        Phosphor
        <span class="tab-count" id="count-ph">0</span>
    </button>
    <button class="tab-btn" data-filter="heroicons">
        Heroicons
        <span class="tab-count" id="count-heroicons">0</span>
    </button>
    <button class="tab-btn" data-filter="ri">
        Remix
        <span class="tab-count" id="count-ri">0</span>
    </button>
    <button class="tab-btn" data-filter="mdi">
        Material
        <span class="tab-count" id="count-mdi">0</span>
    </button>
    <button class="tab-btn" data-filter="fluent">
        Fluent
        <span class="tab-count" id="count-fluent">0</span>
    </button>
</div>
            <p id="icon-count-label" style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;"></p>
        </div>
        
        <main class="icons-wrapper">
            <div id="icons-container" class="icons-container">
                <!-- Ícones injetados via JavaScript -->
            </div>
        </main>
        
        <footer class="footer">
    <p>Desenvolvido com <i data-lucide="heart" class="heart-icon"></i> por <strong>AkiraDev</strong></p>
    <p class="footer-credits">
        Ícones fornecidos por 
        <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a>, 
        <a href="https://tabler.io/icons" target="_blank" rel="noopener">Tabler</a>, 
        <a href="https://phosphoricons.com" target="_blank" rel="noopener">Phosphor</a>, 
        <a href="https://heroicons.com" target="_blank" rel="noopener">Heroicons</a>,
        <a href="https://remixicon.com" target="_blank" rel="noopener">Remix</a>,
        <a href="https://pictogrammers.com/library/mdi/" target="_blank" rel="noopener">Material</a> e
        <a href="https://react.fluentui.dev/?path=/docs/icons-catalog--docs" target="_blank" rel="noopener">Fluent</a>.
        <br>
        Agregados via <a href="https://iconify.design" target="_blank" rel="noopener">Iconify API</a>.
    </p>
</footer>
    </div>

    <!-- Modal de Personalização do Ícone -->
    <div id="icon-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content">
            <button id="close-modal" class="icon-btn close-btn" aria-label="Fechar">
                <i data-lucide="x"></i>
            </button>
            
            <div class="modal-body">
                <div class="preview-area">
                    <div id="svg-preview-container" class="svg-preview">
                        <!-- O SVG do Lucide aparecerá aqui -->
                    </div>
                    <p id="preview-icon-name" class="preview-name">nome-do-icone</p>
                </div>

                <div class="controls-area">
                    <h3>Personalizar</h3>
                    
                    <div class="control-group">
                        <label for="icon-color">Cor</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="icon-color" value="#1a1a1a">
                            <span id="color-hex">#1a1a1a</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="icon-size">Tamanho (<span id="size-value">24</span>px)</label>
                        <input type="range" id="icon-size" min="16" max="128" value="24" step="4">
                    </div>

                    <div class="control-group">
                        <label for="stroke-width">Espessura do Traço (<span id="stroke-value">2</span>px)</label>
                        <input type="range" id="stroke-width" min="0.5" max="4" value="2" step="0.5">
                    </div>

                    <div class="control-group">
                        <label>Formato de Cópia</label>
                        <div class="copy-options">
                            <button class="copy-format-btn active" data-format="svg">SVG Puro</button>
                            <button class="copy-format-btn" data-format="html">Tag &lt;img&gt;</button>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button id="copy-custom-btn" class="primary-btn">
                            <i data-lucide="copy" style="width: 18px; height: 18px; margin-right: 8px;"></i>
                            Copiar Código
                        </button>
                        <button id="download-svg-btn" class="secondary-btn">
                            <i data-lucide="download" style="width: 18px; height: 18px; margin-right: 8px;"></i>
                            Baixar .SVG
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notificação Toast -->
    <div id="toast" class="toast">
        <i data-lucide="check-circle" class="toast-icon"></i>
        <span id="toast-message">Copiado com sucesso!</span>
    </div>

    <script src="icons.js"></script>
    <script src="script.js"></script>
</body>
</html>
